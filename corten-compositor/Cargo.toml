[package]
name = "corten-compositor"
version.workspace = true
edition.workspace = true
license = "GPL-3.0"
authors.workspace = true
repository.workspace = true
description = "Modern dynamic tiling Wayland compositor built with Smithay and Corten Desktop suite"

[dependencies]
corten-theme = { path = "../crates/theme" }
corten-config = { path = "../crates/config" }
corten-services = { path = "../crates/services" }
corten-ipc = { path = "../crates/ipc" }
serde = { workspace = true }
zbus = { workspace = true }
tokio = { version = "1.0", features = ["rt", "macros"] }

smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session",
    "backend_session_libseat",
    "backend_udev",
    "backend_egl",
    "renderer_glow",
    "desktop",
    "wayland_frontend",
    "xwayland",
] }
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
winit = { version = "0.30", features = ["x11", "wayland"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = "1.0"
nix = { version = "0.29", features = ["signal"] }
glow = "0.14"
xcursor = "0.3"
bytemuck = "1.25.2"
png = "0.17"
chrono = "0.4"
ab_glyph = "0.2"
