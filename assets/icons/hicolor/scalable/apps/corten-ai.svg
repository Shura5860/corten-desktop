<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="steel_base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2E38"/>
      <stop offset="100%" stop-color="#1E2129"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E68158"/>
      <stop offset="100%" stop-color="#C95E38"/>
    </linearGradient>
    <linearGradient id="copper_bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA875"/>
      <stop offset="100%" stop-color="#E06C3A"/>
    </linearGradient>
    <linearGradient id="inner_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow_deep" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="glyph_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Clean Borderless M3 Tonal Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" ry="28" fill="url(#steel_base)"/>

  <!-- Hex Prism Recessed Bed -->
  <polygon points="64,24 100,44 100,84 64,104 28,84 28,44" fill="#14171E" stroke="#E06C3A" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Inner Copper Core -->
  <polygon points="64,34 90,49 90,79 64,94 38,79 38,49" fill="url(#copper)" filter="url(#glyph_shadow)"/>
  <!-- Central Glowing Neural Node -->
  <circle cx="64" cy="64" r="12" fill="#101217" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="64" cy="64" r="5" fill="#FFFFFF"/>
  <!-- Connection Traces -->
  <line x1="64" y1="24" x2="64" y2="34" stroke="#FFA372" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="84" x2="90" y2="79" stroke="#FFA372" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="84" x2="38" y2="79" stroke="#FFA372" stroke-width="2" stroke-linecap="round"/>
</svg>