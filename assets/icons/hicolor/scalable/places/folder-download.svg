<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="steel_base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282D38"/>
      <stop offset="45%" stop-color="#1B1E26"/>
      <stop offset="100%" stop-color="#0E1015"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F69256"/>
      <stop offset="50%" stop-color="#E06C3A"/>
      <stop offset="100%" stop-color="#9C3A14"/>
    </linearGradient>
    <linearGradient id="copper_bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA875"/>
      <stop offset="100%" stop-color="#E06C3A"/>
    </linearGradient>
    <linearGradient id="inner_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow_deep" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="glyph_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Outer Squircle with Corten Bevel -->
  <rect x="6" y="6" width="116" height="116" rx="30" ry="30" fill="url(#steel_base)" stroke="#E06C3A" stroke-width="2.2" stroke-opacity="0.60" filter="url(#shadow_deep)"/>
  <!-- Specular Inset Rim -->
  <rect x="8" y="8" width="112" height="112" rx="28" ry="28" fill="url(#inner_glow)" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.2"/>

  <!-- Folder Base -->
  <path d="M28 36 C28 32, 32 30, 36 30 L52 30 L60 38 L92 38 C96 38, 100 42, 100 46 L100 88 C100 92, 96 96, 92 96 L36 96 C32 96, 28 92, 28 88 Z" fill="#1C1F28" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.2"/>
  <path d="M28 50 L100 50 L95 91 C95 95, 91 96, 88 96 L34 96 C30 96, 28 94, 28 90 Z" fill="url(#copper)" filter="url(#glyph_shadow)"/>
  <!-- Download Emblem -->
  <path d="M64 58 L64 78 M56 70 L64 78 L72 70" stroke="#121418" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="54" y1="84" x2="74" y2="84" stroke="#121418" stroke-width="3" stroke-linecap="round"/>
</svg>