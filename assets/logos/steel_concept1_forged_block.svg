<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Backdrop -->
    <radialGradient id="s1-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1615"/>
      <stop offset="60%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#08090b"/>
    </radialGradient>

    <!-- Heavy Cold-Rolled Corten Steel Gradient -->
    <linearGradient id="s1-steel-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd59e"/>
      <stop offset="25%" stop-color="#e5c07b"/>
      <stop offset="60%" stop-color="#d19a66"/>
      <stop offset="100%" stop-color="#be5046"/>
    </linearGradient>

    <!-- Beveled Industrial 45-degree Chamfer Edge -->
    <linearGradient id="s1-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d19a66" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#461814" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="s1-inner-core" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80261f"/>
      <stop offset="100%" stop-color="#221210"/>
    </linearGradient>

    <!-- Neural Node Glow -->
    <radialGradient id="s1-node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffd59e"/>
      <stop offset="75%" stop-color="#e06c75"/>
      <stop offset="100%" stop-color="#be5046" stop-opacity="0"/>
    </radialGradient>

    <filter id="s1-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.95"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#e06c75" flood-opacity="0.25"/>
    </filter>

    <filter id="s1-node-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#s1-bg)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#d19a66" stroke-opacity="0.15" stroke-width="1.5"/>

  <g filter="url(#s1-shadow)">
    <!-- 
      KONSEPT 1: DÖVME ÇELİK BLOK (THE FORGED MONOLITH)
      Tamamen rijit, 90 ve 45 derece keskin açılı, masif çelik gövde.
      Sıfır esneklik; ağır zırh ve endüstriyel çelik konstrüksiyon.
    -->

    <!-- Ana Masif Çelik 'C' Bloğu -->
    <path d="M 364,124 
             L 204,124 
             L 132,196 
             L 132,316 
             L 204,388 
             L 364,388 
             L 364,324 
             L 230,324 
             L 196,290 
             L 196,222 
             L 230,188 
             L 364,188 
             Z" 
          fill="url(#s1-steel-face)"/>

    <!-- 45 Derece Çelik Pah (Chamfer) ve Işık Yansıması -->
    <path d="M 364,124 L 204,124 L 132,196 L 196,196 L 230,162 L 364,162 Z" 
          fill="url(#s1-bevel)" opacity="0.6"/>

    <!-- Alt Çelik Gölge Faseti -->
    <path d="M 132,316 L 204,388 L 364,388 L 364,358 L 220,358 L 172,316 Z" 
          fill="url(#s1-inner-core)"/>

    <!-- Lazer İşlemeli Rijit Nöral Veri Hattı (Açılı ve Düz) -->
    <path d="M 334,156 L 224,156 L 164,216 L 164,296 L 224,356 L 334,356" 
          fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="square"/>

    <!-- 3 NÖRAL ÇELİK PERÇİNİ / DÜĞÜMÜ (Rivet / Neural Nodes) -->
    <!-- Üst Terminal Düğüm (Girdi) -->
    <circle cx="334" cy="156" r="22" fill="url(#s1-node-glow)" opacity="0.4" filter="url(#s1-node-bloom)"/>
    <rect x="323" y="145" width="22" height="22" rx="4" fill="#be5046"/>
    <rect x="325" y="147" width="18" height="18" rx="3" fill="url(#s1-steel-face)"/>
    <circle cx="334" cy="156" r="4" fill="#ffffff" filter="url(#s1-node-bloom)"/>

    <!-- Merkez Omurga Düğümü (Çekirdek) -->
    <circle cx="164" cy="256" r="26" fill="url(#s1-node-glow)" opacity="0.5" filter="url(#s1-node-bloom)"/>
    <rect x="151" y="243" width="26" height="26" rx="5" fill="#be5046"/>
    <rect x="153" y="245" width="22" height="22" rx="4" fill="url(#s1-steel-face)"/>
    <circle cx="164" cy="256" r="5" fill="#ffffff" filter="url(#s1-node-bloom)"/>

    <!-- Alt Terminal Düğüm (Çıktı) -->
    <circle cx="334" cy="356" r="22" fill="url(#s1-node-glow)" opacity="0.4" filter="url(#s1-node-bloom)"/>
    <rect x="323" y="345" width="22" height="22" rx="4" fill="#be5046"/>
    <rect x="325" y="347" width="18" height="18" rx="3" fill="url(#s1-steel-face)"/>
    <circle cx="334" cy="356" r="4" fill="#ffffff" filter="url(#s1-node-bloom)"/>
  </g>

  <!-- Typography -->
  <text x="256" y="466" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="8" fill="#ffd59e" opacity="0.95">CORTEN</text>
</svg>

