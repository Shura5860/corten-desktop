<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-tiling" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#201a18" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0c0e12" stop-opacity="1.0"/>
    </radialGradient>

    <!-- Master Window Gradient (Deep Corten Rust) -->
    <linearGradient id="plate-master" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e06c75"/>
      <stop offset="50%" stop-color="#d19a66"/>
      <stop offset="100%" stop-color="#9a4835"/>
    </linearGradient>

    <!-- Top Stack Plate (Warm Copper Gold) -->
    <linearGradient id="plate-stack-top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd59e"/>
      <stop offset="100%" stop-color="#d19a66"/>
    </linearGradient>

    <!-- Bottom Stack Plate (Oxidized Bronze) -->
    <linearGradient id="plate-stack-bottom" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d19a66"/>
      <stop offset="100%" stop-color="#be5046"/>
    </linearGradient>

    <filter id="tile-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="neon-ambient" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-tiling)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#d19a66" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Subtle ambient halo behind tiling geometry -->
  <circle cx="230" cy="256" r="140" fill="#e06c75" opacity="0.18" filter="url(#neon-ambient)"/>

  <g filter="url(#tile-glow)">
    <!-- 1. LEFT MASTER PILLAR / TILING PLATE (Forms the vertical back of 'C') -->
    <rect x="116" y="116" width="104" height="280" rx="20" fill="url(#plate-master)"/>
    <rect x="116" y="116" width="104" height="280" rx="20" fill="none" stroke="#ffe3bd" stroke-opacity="0.45" stroke-width="2"/>
    <!-- Window Header Accent Line -->
    <circle cx="146" cy="144" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="162" cy="144" r="5" fill="#ffffff" opacity="0.4"/>
    <line x1="144" y1="172" x2="192" y2="172" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" stroke-linecap="round"/>
    <line x1="144" y1="188" x2="180" y2="188" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round"/>

    <!-- 2. TOP-RIGHT STACK PLATE (Forms top arm of 'C') -->
    <rect x="238" y="116" width="158" height="126" rx="20" fill="url(#plate-stack-top)"/>
    <rect x="238" y="116" width="158" height="126" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="266" cy="144" r="5" fill="#3a1c14" opacity="0.7"/>
    <line x1="264" y1="172" x2="354" y2="172" stroke="#3a1c14" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round"/>
    <line x1="264" y1="192" x2="320" y2="192" stroke="#3a1c14" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>

    <!-- 3. BOTTOM-RIGHT STACK PLATE (Forms bottom arm of 'C') -->
    <rect x="238" y="270" width="158" height="126" rx="20" fill="url(#plate-stack-bottom)"/>
    <rect x="238" y="270" width="158" height="126" rx="20" fill="none" stroke="#ffe3bd" stroke-opacity="0.4" stroke-width="2"/>
    <circle cx="266" cy="298" r="5" fill="#ffffff" opacity="0.8"/>
    <line x1="264" y1="326" x2="360" y2="326" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"/>
    <line x1="264" y1="346" x2="330" y2="346" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>

    <!-- Connecting Wayland Tiling Gap Ray (Subtle laser neon bridge) -->
    <line x1="229" y1="130" x2="229" y2="382" stroke="#d19a66" stroke-opacity="0.3" stroke-dasharray="4 6" stroke-width="1.5"/>
  </g>

  <!-- Typography -->
  <text x="256" y="468" text-anchor="middle" font-family="'Inter', 'JetBrains Mono', sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="#ffd59e" opacity="0.9">CORTEN</text>
</svg>

