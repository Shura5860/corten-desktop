[package]
name = "corten-ai"
version.workspace = true
edition.workspace = true
license = "GPL-3.0"
authors = ["Corten Desktop Contributors"]
description = "Native Wayland AI Assistant HUD and Local Agentic Subsystem for Corten Desktop"

[dependencies]
corten-theme = { path = "../crates/theme" }
corten-config = { path = "../crates/config" }
corten-ipc = { path = "../crates/ipc" }
corten-vector = { path = "../crates/vector" }
corten-llm = { path = "../crates/llm" }

# GUI & Layer-shell
iced = { workspace = true, features = ["tiny-skia", "tokio"] }
iced_layershell = "0.7"
iced_runtime = "0.13"

# Async & Serialization
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
zbus.workspace = true
serde.workspace = true
serde_json = "1.0"
directories.workspace = true

# Diagnostics & Utils
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

