name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    name: Build & Package Release (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libseat-dev \
            libudev-dev \
            libinput-dev \
            libgbm-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libpam0g-dev

      - name: Build Release Binaries
        run: cargo build --release --workspace

      - name: Package Release Tarball & SHA256
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG_NAME="corten-desktop-${VERSION}-x86_64-linux"
          mkdir -p "${PKG_NAME}/bin" "${PKG_NAME}/assets" "${PKG_NAME}/systemd" "${PKG_NAME}/packaging"
          for bin in \
            corten-compositor corten-session corten-welcome corten-panel \
            corten-launcher corten-notify corten-settings corten-lock \
            corten-greeter corten-widgets corten-files corten-monitor \
            corten-snipper corten-wallpaper corten-polkit corten-portal \
            cortenctl corten-ai; do
            cp "target/release/${bin}" "${PKG_NAME}/bin/"
          done
          cp -r assets/* "${PKG_NAME}/assets/"
          cp -r systemd/* "${PKG_NAME}/systemd/"
          cp packaging/PKGBUILD "${PKG_NAME}/packaging/"
          cp install.sh README.md LICENSE "${PKG_NAME}/"
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            corten-desktop-*.tar.gz
            corten-desktop-*.tar.gz.sha256

