[package]
name = "corten-capture-session"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portal, PipeWire, and frame-consumer session orchestration"

[features]
default = []
pipewire = ["corten-capture/pipewire"]
ffmpeg = ["pipewire", "corten-capture/ffmpeg"]

[dependencies]
corten-capture = { path = "../capture" }
corten-services = { path = "../services" }
thiserror.workspace = true
tokio = { version = "1.0", features = ["macros", "rt", "signal"] }
zbus = { workspace = true, features = ["tokio"] }
