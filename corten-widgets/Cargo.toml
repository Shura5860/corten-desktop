[package]
name = "corten-widgets"
version.workspace = true
edition.workspace = true
license = "GPL-3.0"
authors.workspace = true
repository.workspace = true
description = "Desktop widgets with live audio waveform, system monitors, and sticky scratchpad for Corten Desktop"

[dependencies]
corten-theme = { path = "../crates/theme" }
corten-config = { path = "../crates/config" }
corten-ipc = { path = "../crates/ipc" }
corten-i18n = { path = "../crates/i18n" }

iced = { workspace = true, features = ["tiny-skia", "tokio", "canvas"] }
iced_layershell = "0.7"
iced_runtime = "0.13"

zbus = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
notify = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
chrono = "0.4"
serde_json = "1.0"
directories = { workspace = true }
