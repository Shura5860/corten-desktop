[package]
name = "corten-welcome"
version.workspace = true
edition.workspace = true
license = "GPL-3.0"
authors.workspace = true
repository.workspace = true
description = "First-Boot Onboarding and Welcome Wizard for Corten Wayland Desktop"

[dependencies]
corten-theme = { path = "../crates/theme" }
corten-config = { path = "../crates/config" }
corten-ipc = { path = "../crates/ipc" }
corten-services = { path = "../crates/services" }
corten-i18n = { path = "../crates/i18n" }

# GUI Toolkit
iced = { workspace = true, features = ["tiny-skia", "tokio", "image"] }
iced_layershell = "0.7"
iced_runtime = "0.13"
serde = { workspace = true }
toml = { workspace = true }
tokio = { version = "1.0", features = ["rt", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
anyhow = "1.0"
zbus = { workspace = true, features = ["tokio"] }

