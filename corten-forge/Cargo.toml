[package]
name = "corten-forge"
version.workspace = true
edition.workspace = true
license = "GPL-3.0"
authors.workspace = true
repository.workspace = true
description = "Native Wayland App Store & Unified Package Center for Corten Desktop (Flatpak, Pacman, AUR & AI)"

[dependencies]
corten-theme = { path = "../crates/theme" }
corten-config = { path = "../crates/config" }
corten-ipc = { path = "../crates/ipc" }
corten-update = { path = "../corten-update" }

# GUI Toolkit
iced = { workspace = true, features = ["tiny-skia", "tokio", "image"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "fs", "time"] }
futures = "0.3"
serde = { workspace = true }
serde_json = "1.0"
toml = { workspace = true }
directories = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

