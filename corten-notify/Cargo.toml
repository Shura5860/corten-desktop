[package]
name = "corten-notify"
version.workspace = true
edition.workspace = true
license = "GPL-3.0"
authors = ["Corten Desktop Contributors"]
description = "Lightweight, beautiful Wayland notification daemon for Corten Desktop"

[dependencies]
corten-theme = { path = "../crates/theme" }
corten-config = { path = "../crates/config" }
corten-ipc = { path = "../crates/ipc" }

# GUI & Layer-shell
iced = { workspace = true, features = ["tiny-skia", "tokio"] }
iced_layershell = "0.7"
iced_runtime = "0.13"

# D-Bus & Async
zbus = { workspace = true, features = ["tokio"] }
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Utilities & Config
notify.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
