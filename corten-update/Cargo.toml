[package]
name = "corten-update"
version.workspace = true
edition.workspace = true
license = "GPL-3.0"
authors.workspace = true
repository.workspace = true
description = "Over-the-Air (OTA) automated update daemon and updater for Corten Desktop"

[dependencies]
