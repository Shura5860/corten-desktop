[package]
name = "corten-snipper"
version.workspace = true
edition.workspace = true
license = "GPL-3.0"
authors.workspace = true
repository.workspace = true
description = "Native Wayland screen region selection and snipping tool for Corten Desktop"

[dependencies]
corten-config = { path = "../crates/config" }
corten-theme = { path = "../crates/theme" }

iced = { workspace = true, features = ["tiny-skia", "canvas", "image", "tokio"] }
image_crate = { package = "image", version = "0.24", default-features = false, features = ["png"] }
iced_layershell = "0.7"
iced_runtime = "0.13"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
